<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="sitestyling.css">
<center><img src="bannerlogo.png" alt="banner"></center>
<br>
</head>
<body>
<center><img src="moon.gif" height=15% width=15% alt="moon"></center>
<center><p style="color:red;">Affirm your security...</p></center>
<form id="SubmissionForm">
<div class = "userlogin_container">
<label for="Username"><b>Username</b></label>
<input type="text" name="Username" id="Username" required>
<label for="Password"><b>Password</b></label>
<input type="password" name="Password" id="Password" required>
<input type="submit" value="Register" id="registerButton">
<input type="submit" value="Login" id="loginButton">
<label> <input type="checkbox" checked="checked" name="rememberme"> Remember me </label>
</div>
</form>

<div class="userlogin_container">
<a href="https://www.w3schools.com">Forgot Username?</a>
<a href="https://www.w3schools.com">Forgot Password?</a>
</div>
</body>
</html>

<script src="script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('SubmissionForm');
        const loginButton = document.getElementById('loginButton');
        
        loginButton.addEventListener('click', function (event) {
            event.preventDefault();

            const UsernameField = document.getElementById('Username').value;
            const PasswordField = document.getElementById('Password').value;

            const data = {
                "user_name": UsernameField,
                "user_password": PasswordField
            };

            // Fetch the RegisteredUsers.json file
            fetch('RegisteredUsers.json')
                .then(response => response.json())
                .then(responseData => {
                    // Access the "Registered Users" array
                    const users = responseData['Registered Users'];

                    // Find the user object that matches the Username and Password
                    const user = users.find(user => user.Username === data.user_name && user.Password === data.user_password);

                    if (user) {
                        alert('Login successful');
                        window.location.href="./nextpage.html"; // Redirect to next page
                    } else {
                        alert('Incorrect username or password');
                    }
                })
                .catch(error => {
                    console.error('Fetch request failed:', error);
                });
        });
    });
</script>

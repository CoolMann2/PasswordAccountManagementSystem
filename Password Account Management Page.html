<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="sitestyling.css">
<!--Navbar styling-->
<style>
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    
    li {
      display: inline;
    }
</style>
<br>
</head>
<body>
<!--Navbar for helpful sections about the SPA-->
<ul>
    <center>
        <li onclick="loadPage('home')">Home</li>
        <li onclick="loadPage('about')">About</li>
        <li onclick="loadPage('help')">Help</li>
        <li onclick="loadPage('contact')">Contact</li>
    </center>
</ul>
<!--Allows for different pages to be loaded in at a time-->
<div id="item">
        <!--Dynamic page containter-->
</div>
</body>
</html>

<script src="script.js"></script>
<script>
    //Contains the contents of different sections of the SPA, all in one html than several thanks to javascript
    const pages = {
            home: `
                <center><img src="bannerlogo.png" alt="banner"></center>
                <center><a href="javascript:void(0);" onclick="loadPage('easteregg')"><img src="moon.gif" height="15%" width="15%" alt="moon"></a></center>
                <center><p style="color:red;">Affirm your security...</p></center>
                <form id="SubmissionForm">
                <div class="userlogin_container">
                <label for="Username"><b>Username</b></label>
                <input type="text" name="Username" id="Username" required>
                <label for="Password"><b>Password</b></label>
                <input type="password" name="Password" id="Password" required>
                <label for="StrengthSlider">Password Strength</label>
                <input type="" id="StrengthSlide" min="0" max="100" disabled>
                <br>
                <input type="submit" value="Register" id="registerButton">
                <input type="submit" value="Login" id="loginButton">
                <label> <input type="checkbox" id="rememberMe" value="RememberMeCheckbox" name="rememberme"> Remember me </label>
                <!--Links used in case password is forgotten -->
                <a href="javascript:void(0);" onclick="loadPage('forgotusername')">Forgot Username?</a>
                <a href="javascript:void(0);" onclick="loadPage('forgotpassword')">Forgot Password?</a>
                </div>
                </div>
                </form>
            `,
            about: `
                <center><img src="about.png" alt="about"></center>
                <br>
                <center><img src="bunny_moon.gif" height=20% width=20% alt="rabbit"></center>
                <div class="userlogin_container">
                <p>Password Account Management System is a password manager created for my 1004 module of my first university year.
                With it you can store passwords, "log-in" passwords to check if they have saved properly, test password strength
                using the password strength bar, find forgotten credentials with the forgotten username and password pages, save
                credentials in the form with the rememberme checkbox, and more.</p>
                <p>If confused on how to use the website please refer to the help page in the navbar for relevant information.</p>
                </div>
            `,
            help: `
                <center><img src="help.png" alt="help"></center>
                <center><img src="confused.png" height=15% width=15% alt="mooncheese"></center>
                <div class = "userlogin_container">
                <p>Welcome to the help page, here you'll find information on how to use the site.</p>
                <p>Storing a username & password: Type a username and password into the form on the main page
                and press register, you'll get a notification stating it has saved successfully and it will
                store it in localstorage where it can be then be used for "logging-in" aka testing it has saved properly.
                Credentials can also be manually added through the given JSON file in the document folder.
                </p>
                <p>Logging in: Add your username and password to the form on the main page, the program will check
                if your details exist within localstorage or the json, and if successful will "log you in".
                This tool is helpful for confirming your details are saved in the system successfully.
                </p>
                <p>Finding forgotten credentials: If you somehow have forgotten your already stored login,
                the forgotten username and password pages can help you with this depending on which you've
                lost. Add your known username or password (depending on page) into the box and the
                application will search the localstorage or json for the associated credential, if 
                found it will be displayed saving you the effort of having to remember it.
                </p>
                <p>Saving credentials in form: If you want to your credentials to be saved in the form, the 
                rememberme checkbox can be used for just that, as long as the checkbox is ticked it will
                keep the details there in the form for further testing later on.
                </p>
                <p>Password Strength Indicator: This useful tool can be used for testing the strength of your
                password before submitting it to the system, this is very useful in case your unsure the
                password you want to use is all that safe to be using. This indicator checks for upper and 
                lowercase letters, numbers, symbols, etc, to make sure the user is using a wide myriad of
                characters in order for their password to be as secure as possible
                </p>
            `,
            contact: `
                <center><img src="contact.png" alt="contact"></center>
                <br>
                <center><img src="computer.png" height=15% width=15% alt="computer"></center>
                <div class = "userlogin_container">
                <p>For any enquiries about my university project please contact me at: alexander.nemeth@students.plymouth.ac.uk</p>
                <p>To follow the project's progress and monitor any updates be sure to check out my Github: https://github.com/CoolMann2/PasswordAccountManagementSystem</p>
                </div>
            `,
            forgotusername: `
                <center><img src="forgotusername.png" alt="banner"></center>
                <br>
                <center><img src="emoji-thinking.gif" height=15% width=15% alt="thinkingemoji"></center>
                <center><p style="color:red;">Enter your password below...</p></center>
                <form id="SubmissionForm">
                <div class = "userlogin_container">
                <label for="Password"><b>Password</b></label>
                <input type="password" name="Password" id="ForgotPassword" required>
                <input type="submit" value="Submit" id="submitButton">
                <p id="result" style="color:rgb(248, 0, 0);"></p>
                </form>
                </div>
                <center><a href="javascript:void(0);" onclick="loadPage('home')">[Go back]</a></center>
            `,
            forgotpassword: `
                <center><img src="forgotpassword.png" alt="banner"></center>
                <br>
                <center><img src="emoji-thinking.gif" height=15% width=15% alt="thinkingemoji"></center>
                <center><p style="color:red;">Enter your username below...</p></center>
                <form id="SubmissionForm">
                <div class = "userlogin_container">
                <label for="Username"><b>Username</b></label>
                <input type="text" name="Username" id="ForgotUsername" required>
                <input type="submit" value="Submit" id="submitButton">
                <p id="result" style="color:rgb(248, 0, 0);"></p>
                </form>
                </div>
                <center><a href="javascript:void(0);" onclick="loadPage('home')">[Go back]</a></center>
            `,
            easteregg: `
                <center><h1 style="color:rgb(255, 0, 0);">Did you know the moon is made of cheese? Tuck in, lad.</h1></center>
                <center><img src="mooncheese.gif" height=25% width=25% alt="mooncheese"></center>
                <center><a href="javascript:void(0);" onclick="loadPage('home')">[Go back]</a></center>
            `
        };

        //Function to load pages dynamically
        function loadPage(page) {
            document.getElementById("item").innerHTML = pages[page];
            if (page === 'home') {
                HomePageScript();  // Initialize home page-specific JS
            } else if (page === 'forgotusername') {
                ForgotUserPageScript();
            } else if (page === 'forgotpassword') {
                ForgotPassPageScript();
            }
    }
    
    //Loads the home page by default
    document.addEventListener("DOMContentLoaded", () => loadPage('home'));
    
    function HomePageScript() {
            //Code for slider that tests the passwords strength
            let password = document.getElementById("Password");
            let strength = document.getElementById("StrengthSlide");
            //Makes it so function activates when password input is done
            password.oninput = function () {
                //Values attributed to the bar
                let strongness = 0;
                let value = password.value;
                //How far the bar can stretch and colours associated
                let widthStrength = ["1%", "25%", "50%", "75%", "100%"];
                let colorStrength = ["#D73F40", "#DC6551", "#F2B84F", "#BDE952", "#3ba62f"];

                //Values selected that when input or removed cause the bar to get bigger and smaller
                if (value.length >= 6) {
                    let arrayTest = [/[0-9]/, /[a-z]/, /[A-Z]/, /[^0-9a-zA-Z]/];
                    arrayTest.forEach((item) => {
                        if (item.test(value)) {
                            strongness += 1;
                        }
                    });
                }
                strength.style.width = widthStrength[strongness];
                strength.style.backgroundColor = colorStrength[strongness];
            };

            //Checkbox script for remembering the user's username and password
            const RememberMeCheck = document.getElementById("rememberMe");
            const UsernameInput = document.getElementById("Username");
            const PasswordInput = document.getElementById("Password");

            //Retrieves and discards form data based on checkbox status
            if (localStorage.checkbox && localStorage.checkbox !== "") {
                RememberMeCheck.setAttribute("checked", "checked");
                UsernameInput.value = localStorage.Username;
                PasswordInput.value = localStorage.Password;
            //Removes values if rememberme is unchecked
            } else {
                RememberMeCheck.removeAttribute("checked");
                UsernameInput.value = "";
                PasswordInput.value = "";
            }

            //Function used for saving and removing username and password form fill data to localstorage
            function RememberMeCheckbox() {
                if (RememberMeCheck.checked && UsernameInput.value !== "" && PasswordInput.value !== "") {
                    localStorage.Username = UsernameInput.value;
                    localStorage.Password = PasswordInput.value;
                    localStorage.checkbox = RememberMeCheck.value;
                } else {
                    localStorage.Username = "";
                    localStorage.Password = "";
                    localStorage.checkbox = "";
                }
            }

            //Gets elements needed from the HTML
            const registerButton = document.getElementById('registerButton');
            //Register button used for saving user details into localstorage
            registerButton.addEventListener('click', function (event) {
                event.preventDefault();
                
                const UsernameField = UsernameInput.value;
                const PasswordField = PasswordInput.value;
                
                //Prevents empty form submissions
                if (UsernameField === "" || PasswordField === "") {
                alert('Form can not be empty!');
                return;
                }
                
                //Gets new user details from form 
                const newUser = {
                    "Username": UsernameField,
                    "Password": PasswordField
                };

                //Looks for users in localstorage
                let users = JSON.parse(localStorage.getItem('RegisteredUsers')) || { "Registered Users": [] };

                //Checks if username already in use in localstorage
                const existingUserLS = users['Registered Users'].find(user => user.Username === UsernameField);
                if (existingUserLS) {
                    alert('Username already exists!');
                    return;
                }
                
                //Checks registeredusers instead
                fetch('RegisteredUsers.json')
                .then(response => response.json())
                .then(responseData => {
                // Checks if username already exists in JSON
                const existingUserJSON = responseData['Registered Users'].find(user => user.Username === UsernameField);
                if (existingUserJSON) {
                   alert('Username already exists!');
                return;
                }

                //Makes space for new user in local storage
                users['Registered Users'].push(newUser);

                //Saves new user list in localstorage
                localStorage.setItem('RegisteredUsers', JSON.stringify(users));

                alert('Registration successful!');
            });
        }); 

            //Button used for logging in
            const loginButton = document.getElementById('loginButton');
            loginButton.addEventListener('click', function (event) {
                event.preventDefault();
                
                //Activates the function for saving the details in username and password to localstorage for the input boxes
                RememberMeCheckbox();
                
                //Gets for required fields for validating data
                const UsernameField = UsernameInput.value;
                const PasswordField = PasswordInput.value;

                //Prevents empty form submissions
                if (UsernameField === "" || PasswordField === "") {
                alert('Form can not be empty!');
                return;
                }

                //Checks localstorage for user data first
                let users = JSON.parse(localStorage.getItem('RegisteredUsers')) || { "Registered Users": [] };

                const user = users['Registered Users'].find(user => user.Username === UsernameField && user.Password === PasswordField);
                    if (user) {
                        alert('Login successful!');
                        return;
                    }
                    //Checks json after
                    fetch('RegisteredUsers.json')
                        .then(response => response.json())
                        .then(responseData => {
                            users = responseData;
                            //Checks for user in json field
                            const user = users['Registered Users'].find(user => user.Username === UsernameField && user.Password === PasswordField);
                            
                            if (user) {
                                alert('Login successful!');
                            } else {
                                alert('Incorrect username or password');
                            }
                        })
                        .catch(error => {
                            console.error('Fetch request failed:', error);
                            alert('Error loading users.');
                    });
            });
        }
        function ForgotUserPageScript() {
        //Gets form submission details and result id details
        const form = document.getElementById('SubmissionForm');
        const resultDisplay = document.getElementById('result');
        
        //Listens for input
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            
            //Gets password details to match with related username
            const password = document.getElementById('ForgotPassword').value;
            
            let users = JSON.parse(localStorage.getItem('RegisteredUsers')) || { "Registered Users": [] };

            //Function for finding user details
            function findUser(usersData) {
                const user = usersData['Registered Users'].find(user => user.Password === password);
                if (user) {
                    resultDisplay.textContent = `Your username is: ${user.Username}`;
                    return true; //True and false flags to properly verify if details are there
                } else {
                    resultDisplay.textContent = 'Password not found!';
                    return false;
                }
            }

            //Checks localstorage first
            if (findUser(users)) {
                return;
            } else {
                //Checks json instead
                fetch('RegisteredUsers.json')
                    .then(response => response.json())
                    .then(responseData => findUser(responseData))
                    .catch(error => {
                        console.error('Fetch request failed:', error);
                        resultDisplay.textContent = 'Error loading users.';
                        resultDisplay.style.color = 'red';
                    });
            }
        });
    }         
        function ForgotPassPageScript() {
        //Gets form submission details and result id details
            const form = document.getElementById('SubmissionForm');
            const resultDisplay = document.getElementById('result');
            
            //Listens for input
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                
                //Gets username details to match with related password
                const username = document.getElementById('ForgotUsername').value;

                let users = JSON.parse(localStorage.getItem('RegisteredUsers')) || { "Registered Users": [] };
                
                //Function for finding user details
                function findUser(usersData) {
                    const user = usersData['Registered Users'].find(user => user.Username === username);
                    if (user) {
                        resultDisplay.textContent = `Your password is: ${user.Password}`;
                        return true;
                    } else {
                        resultDisplay.textContent = 'Username not found!';
                        return false;
                    }
                }

                //Checks localstorage
                if (findUser(users)) {
                    return;
                } else {
                    //Checks JSON instead
                    fetch('RegisteredUsers.json')
                        .then(response => response.json())
                        .then(responseData => findUser(responseData))
                        .catch(error => {
                            console.error('Fetch request failed:', error);
                            resultDisplay.textContent = 'Error loading users.';
                            resultDisplay.style.color = 'red';
                        });
                }
            });
        }
</script>
